[project]
name = "journey101-backend"
version = "0.1.0"
description = "FastAPI backend for Journey101."
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.14.1",
    "fastapi==0.115.6",
    "firebase-admin==6.6.0",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
cache-dir = "../.cache/uv"
