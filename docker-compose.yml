services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app_password@postgres:5432/journey101}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-journey101-local}
      FIREBASE_AUTH_EMULATOR_HOST: auth-emulator:9099
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./backend
        target: /app
      - type: volume
        source: backend_venv
        target: /app/.venv
        volume:
          nocopy: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-emulator:
        condition: service_started

  migrate:
    build:
      context: ./backend
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app_password@postgres:5432/journey101}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    command: ["uv", "run", "--no-dev", "python", "-m", "app.commands.seed"]
    profiles: ["seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app_password@postgres:5432/journey101}
    depends_on:
      migrate:
        condition: service_completed_successfully

  auth-emulator:
    image: andreysenov/firebase-tools:13.29.2
    command: ["firebase", "emulators:start", "--only", "auth", "--project", "journey101-local"]
    working_dir: /workspace
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
    ports:
      - "9099:9099"

  postgres:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-journey101}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_venv:
  postgres_data:
